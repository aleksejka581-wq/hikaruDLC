name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ -f hikaruDLC-stage1.zip ]; then
            echo "Found ZIP, unpacking..."
            unzip -o hikaruDLC-stage1.zip
            if [ -d hikaruDLC ]; then
              shopt -s dotglob
              mv hikaruDLC/* .
              rmdir hikaruDLC
            fi
          fi
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unpacking $z ..."
              unzip -o "$z"
              if [ -d hikaruDLC ]; then
                shopt -s dotglob
                mv hikaruDLC/* .
                rmdir hikaruDLC || true
              fi
            fi
          done
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hikaruDLC-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hikaruDLC-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
